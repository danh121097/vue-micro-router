name: CI/CD

on:
  push:
    branches: [master]

jobs:
  # Quality gate: type check, lint, unit tests, and library build.
  # Both deploy-docs and release depend on this passing.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun test

      # The suite shares one DOM realm across files (tests/setup-sfc.ts), so a
      # test that installs a global and never restores it only fails once
      # something else runs first. A fixed seed keeps that detectable without
      # making CI itself nondeterministic.
      - name: Test (randomized order)
        run: bun test --randomize --seed=20260905

      - name: Build
        run: bun run build

      - name: Verify dist output
        run: |
          test -f dist/index.mjs || exit 1
          test -f dist/audio.mjs || exit 1
          test -f dist/styles.css || exit 1
          echo "All dist files present"

      # The devtools inspector used to ship inside the core entry, unreachable,
      # because a runtime guard survived tree-shaking. One static import added
      # back to use-micro-router.ts silently undoes that fix, and every other
      # gate stays green — so assert the two properties directly.
      - name: Verify devtools stays out of the core entry
        run: |
          test -f dist/devtools-plugin.mjs || {
            echo "devtools was not emitted as its own chunk"; exit 1;
          }
          if grep -q "micro-router-inspector" dist/index.mjs; then
            echo "devtools code leaked back into dist/index.mjs"; exit 1
          fi
          # Ceiling is the pre-plan baseline: the performance work must never
          # leave the entry bigger than it found it. A tighter per-phase number
          # gets re-argued every phase and stops meaning anything — the exact
          # figures live in plans/.../plan.md. The two checks above are the
          # precise ones; this is the blunt "no net regression" backstop.
          size=$(gzip -c dist/index.mjs | wc -c)
          echo "dist/index.mjs: ${size} B gzip (baseline ceiling 12644)"
          test "$size" -le 12644 || exit 1

  # Build the VitePress docs and deploy to Cloudflare Pages.
  deploy-docs:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build documentation
        run: bun run docs:build
        env:
          NODE_ENV: production

      # Self-provision the Pages project on first run only; on later runs it already
      # exists, so we skip creation cleanly instead of emitting an "already exists" error.
      - name: Ensure Cloudflare Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ! bunx wrangler pages project list | grep -q 'vue-micro-router'; then
            echo "Project not found — creating..."
            bunx wrangler pages project create vue-micro-router --production-branch=master
          else
            echo "Project already exists — skipping creation."
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy website/.vitepress/dist --project-name=vue-micro-router --branch=master

  # Tag + GitHub release when package.json version has no matching tag yet.
  # Depends only on test — a failed docs deploy must not block the release.
  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Get version from package.json
        id: version
        run: echo "version=v$(node -p 'require("./package.json").version')" >> $GITHUB_OUTPUT

      - name: Check if tag exists
        id: check
        run: |
          if git rev-parse "${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Bun
        if: steps.check.outputs.exists == 'false'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Generate the new version's section from conventional commits and inject it
      # under the "# Changelog" title, preserving all curated history below.
      # Pushed with GITHUB_TOKEN so it does not re-trigger CI (plus [skip ci]).
      #
      # Expected to fail, and non-fatal on purpose. master requires a pull
      # request and github-actions[bot] cannot be exempted: bypass actors for a
      # GitHub App are an organization-only feature, and this repo is owned by a
      # user, so the API rejects it —
      #   422 "Actor GitHub Actions integration must be part of the ruleset
      #        source or owner organization"
      # Classic branch protection on a personal repo has no equivalent either.
      # The push is therefore rejected every release. It used to abort the job
      # and take "Create GitHub Release" down with it; the release is the part
      # that matters, so it no longer waits on this.
      #
      # Commit website/changelog.md by hand after each release — the same
      # git-cliff invocation below reproduces the section:
      #   bunx git-cliff@latest --unreleased \
      #     --tag "v$(node -p 'require("./package.json").version')" \
      #     --config cliff.toml
      # Automating it again needs the workflow to push as an admin (a PAT in
      # place of GITHUB_TOKEN), which was weighed and declined: a long-lived
      # credential with write access to a public repo, to save one command.
      - name: Update changelog
        if: steps.check.outputs.exists == 'false'
        continue-on-error: true
        run: |
          bunx git-cliff@latest --unreleased --tag "${{ steps.version.outputs.version }}" --config cliff.toml > /tmp/section.md
          if [ ! -s /tmp/section.md ]; then
            echo "No unreleased commits — skipping changelog update."
            exit 0
          fi
          awk 'NR==FNR{sec=sec $0 ORS; next} /^# Changelog/&&!d{print; print ""; printf "%s", sec; d=1; next} 1' \
            /tmp/section.md website/changelog.md > /tmp/changelog.md
          mv /tmp/changelog.md website/changelog.md
          if git diff --quiet website/changelog.md; then
            echo "Changelog already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/changelog.md
          git commit -m "📚docs(changelog): ${{ steps.version.outputs.version }} [skip ci]"
          git push

      - name: Create GitHub Release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
